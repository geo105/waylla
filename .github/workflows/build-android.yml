name: Crear APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Waylla Campo debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Crear APK de prueba
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: waylla-campo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
